worker_processes auto;
pid /path/to/ddnsGo/Nginx/logs/nginx.pid;
error_log /path/to/ddnsGo/Nginx/logs/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /path/to/ddnsGo/Nginx/root/etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /path/to/ddnsGo/Nginx/logs/access.log;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    client_max_body_size 100m;
    client_body_temp_path ~/.cache/nginx-tmp/client_body;
    proxy_temp_path ~/.cache/nginx-tmp/proxy;
    fastcgi_temp_path ~/.cache/nginx-tmp/fastcgi;
    uwsgi_temp_path ~/.cache/nginx-tmp/uwsgi;
    scgi_temp_path ~/.cache/nginx-tmp/scgi;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /path/to/ddnsGo/Nginx/conf.d/*.conf;
}
