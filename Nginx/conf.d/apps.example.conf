# 「Nginx/control」控制台生成配置的格式示例(实际 apps.conf 由控制台生成,勿手改)
# 路径请替换为自己的环境;证书来自 acme.sh DNS 验证签发的泛域名证书

# HTTP 统一跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name app1.example.org app2.example.org;
    return 301 https://$host$request_uri;
}

# 未匹配的域名直接拒绝
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    ssl_certificate     /home/<你的用户名>/.config/ddns-go/acme/*.example.org_ecc/fullchain.cer;
    ssl_certificate_key /home/<你的用户名>/.config/ddns-go/acme/*.example.org_ecc/*.example.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 404;
}

# app1.example.org → 本机 9632 端口
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app1.example.org;
    ssl_certificate     /home/<你的用户名>/.config/ddns-go/acme/*.example.org_ecc/fullchain.cer;
    ssl_certificate_key /home/<你的用户名>/.config/ddns-go/acme/*.example.org_ecc/*.example.org.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    location / {
        proxy_pass http://127.0.0.1:9632;
    }
}

# app2.example.org → 本机 9633 端口(结构同上,略)
